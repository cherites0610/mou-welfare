[project]
name = "mou-welfare-scraper"
version = "0.1.0"
description = "哞福利 v2 爬蟲（docs/scraper.md）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "odfpy>=1.4.1",
    "pydantic>=2.10",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0",
    "selectolax>=1.0.2",
    "trafilatura>=2.3.1",
    "typer>=0.15",
]

[project.scripts]
scrape = "scraper.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.15",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scraper"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 連到真實政府網站的金絲雀測試（不在 CI 執行）"]
addopts = "-m 'not live'"
# 有設定 SOCKS proxy 的環境變數時，urllib3（trafilatura 的依賴）會警告缺少 PySocks；與測試無關
filterwarnings = ["ignore::urllib3.exceptions.DependencyWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scraper"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["odf.*", "trafilatura.*"]
ignore_missing_imports = true
