[project]
name = "mou-welfare-scraper"
version = "0.1.0"
description = "哞福利 v2 爬蟲（docs/scraper.md）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
scrape = "scraper.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scraper"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 連到真實政府網站的金絲雀測試（不在 CI 執行）"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scraper"]
mypy_path = "src"
