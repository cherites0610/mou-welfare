# 自動部署（docs/backend.md §10）：main 的 CI 通過後，部署「通過 CI 的那個 commit」。
# 也可以在 Actions 頁面手動執行（workflow_dispatch，部署目前的 main）。
#
# 需要的 secrets（未設定時對應的 job 會略過並提示，不會失敗）：
#   API  ：DEPLOY_SSH_KEY（只能執行 ops/deploy-api.sh 的私鑰）、DEPLOY_HOST、DEPLOY_KNOWN_HOSTS
#   前端 ：CLOUDFLARE_API_TOKEN（Workers 編輯權限）、CLOUDFLARE_ACCOUNT_ID
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 同一時間只跑一個部署，後到的排隊、不取消進行中的部署
concurrency:
  group: deploy-production
  cancel-in-progress: false

# resolve 要查上一次成功的部署（actions: read）
permissions:
  contents: read
  actions: read

jobs:
  # 決定要部署的 commit，以及哪些部分有變動：和上一次成功的部署比較（中間 CI 失敗沒部署的 commit 也算進去）。
  # 手動執行、或找不到上一次的部署時，全部部署。
  resolve:
    name: resolve commit
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      admin: ${{ steps.changes.outputs.admin }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          all() { for k in api web admin; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; echo "部署全部：$1"; exit 0; }
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && all '手動執行'
          base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')" || all '查詢上一次部署失敗'
          { [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; } || all '找不到上一次成功的部署'
          files="$(git diff --name-only "$base" "$SHA")"
          echo "和上一次部署 ${base:0:7} 比較，變動的檔案："; echo "$files"
          # 三者共用：shared 套件、依賴、Node 版本、這個 workflow 本身
          common='^(packages/shared/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|\.nvmrc$|\.github/workflows/deploy\.yml$)'
          has() { printf '%s\n' "$files" | grep -qE "$common|$1" && echo true || echo false; }
          # 爬蟲與排程腳本跑在主機的部署目錄，由 API 的部署更新
          echo "api=$(has '^(apps/api/|services/scraper/|ops/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(has '^apps/web/')" >> "$GITHUB_OUTPUT"
          echo "admin=$(has '^apps/admin/')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  api:
    name: deploy api (ssh → pm2)
    needs: resolve
    if: needs.resolve.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - id: cfg
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::API 部署略過：尚未設定 DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_KNOWN_HOSTS"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: deploy ${{ needs.resolve.outputs.sha }}
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 伺服器端以 authorized_keys 的 command= 強制執行 ops/deploy-api.sh，這裡只能傳入 commit SHA
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_HOST" "${{ needs.resolve.outputs.sha }}"

  web:
    name: deploy web (Cloudflare Workers)
    needs: resolve
    if: needs.resolve.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::前端部署略過：尚未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.cfg.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile --filter @mou-welfare/web...
      - if: steps.cfg.outputs.enabled == 'true'
        run: pnpm --filter @mou-welfare/web build
      - if: steps.cfg.outputs.enabled == 'true'
        run: pnpm --filter @mou-welfare/web run deploy  # 要加 run：pnpm 有同名的內建指令 deploy

  admin:
    name: deploy admin (Cloudflare Workers, admin.mou-welfare.com)
    needs: resolve
    if: needs.resolve.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::後台部署略過：尚未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.cfg.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile --filter @mou-welfare/admin...
      - if: steps.cfg.outputs.enabled == 'true'
        run: pnpm --filter @mou-welfare/admin build
        env:
          # 純前端：API 位址在建置時寫入（docs/admin.md）
          NUXT_PUBLIC_API_BASE: https://api.mou-welfare.com
          NUXT_PUBLIC_WEB_BASE: https://mou-welfare.com
      - if: steps.cfg.outputs.enabled == 'true'
        run: pnpm --filter @mou-welfare/admin run deploy  # 要加 run：pnpm 有同名的內建指令 deploy

  smoke:
    name: production smoke test
    needs: [resolve, api, web, admin]
    # 沒變動的部分會被略過（skipped），仍要檢查正式環境；任何一個部署失敗就不跑
    if: ${{ !cancelled() && !failure() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: api /health
        run: |
          for i in $(seq 1 12); do
            body=$(curl -fsS -m 10 https://api.mou-welfare.com/health || true)
            echo "$body" | grep -q '"status":"ok"' && { echo "$body"; exit 0; }
            sleep 5
          done
          echo "::error::api health check failed: $body"; exit 1
      - name: web /login
        run: |
          code=$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://mou-welfare.com/login)
          [ "$code" = "200" ] || { echo "::error::mou-welfare.com/login returned $code"; exit 1; }
          echo "web ok ($code)"
      - name: admin /login
        run: |
          # 靜態資產會把 /login 轉到 /login/（307），跟隨轉址
          code=$(curl -sL -m 15 -o /dev/null -w '%{http_code}' https://admin.mou-welfare.com/login)
          [ "$code" = "200" ] || { echo "::error::admin.mou-welfare.com/login returned $code"; exit 1; }
          echo "admin ok ($code)"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/web/e2e
            .nvmrc
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: SEO（sitemap、robots.txt、canonical、og、noindex）
        env:
          SEO_MIN_PROGRAMS: '500'
        run: node apps/web/e2e/seo-check.cjs https://mou-welfare.com
